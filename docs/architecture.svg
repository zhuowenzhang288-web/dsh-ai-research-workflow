<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#A5B4FC"/>
    </marker>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#6366F1" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <rect width="960" height="490" fill="#F8FAFF"/>

  <!-- deco dots -->
  <circle cx="60" cy="30" r="5" fill="#C7D2FE" opacity="0.6"/>
  <circle cx="900" cy="42" r="7" fill="#FBCFE8" opacity="0.6"/>
  <circle cx="935" cy="20" r="4" fill="#A7F3D0" opacity="0.7"/>
  <circle cx="30" cy="200" r="6" fill="#FDE68A" opacity="0.6"/>
  <circle cx="945" cy="300" r="6" fill="#C7D2FE" opacity="0.5"/>
  <text x="880" y="215" font-size="18" opacity="0.5">✨</text>
  <text x="52" y="300" font-size="16" opacity="0.5">💫</text>

  <!-- ===== Title ===== -->
  <text x="480" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#312E81">🧪 现象驱动 · AI 科研工作流</text>
  <text x="480" y="72" text-anchor="middle" font-size="13" fill="#64748B">先在小系统里做实验找规律，再由规律反推 idea —— 不凭空胡想</text>

  <!-- ===== Main chain stickers ===== -->
  <!-- c1 造现象 -->
  <g filter="url(#soft)">
    <rect x="30" y="98" width="130" height="80" rx="18" fill="#FFFFFF" stroke="#34D399" stroke-width="2.5"/>
  </g>
  <rect x="46" y="106" width="44" height="7" rx="3.5" fill="#6EE7B7"/>
  <text x="46" y="140" font-size="15" font-weight="700" fill="#059669">🧫 造现象</text>
  <text x="46" y="162" font-size="10" fill="#6B7280">小系统·海量秒级实验</text>

  <!-- c2 找规律 -->
  <g filter="url(#soft)">
    <rect x="185" y="98" width="130" height="80" rx="18" fill="#FFFFFF" stroke="#22D3EE" stroke-width="2.5"/>
  </g>
  <rect x="201" y="106" width="44" height="7" rx="3.5" fill="#67E8F9"/>
  <text x="201" y="140" font-size="15" font-weight="700" fill="#0891B2">🔍 找规律</text>
  <text x="201" y="162" font-size="10" fill="#6B7280">普遍成立 → 公式化</text>

  <!-- c3 规律反推 idea -->
  <g filter="url(#soft)">
    <rect x="340" y="98" width="130" height="80" rx="18" fill="#FFFFFF" stroke="#FBBF24" stroke-width="2.5"/>
  </g>
  <rect x="356" y="106" width="44" height="7" rx="3.5" fill="#FCD34D"/>
  <text x="356" y="140" font-size="14" font-weight="700" fill="#B45309">💡 反推 idea</text>
  <text x="356" y="162" font-size="10" fill="#6B7280">规律驱动不凭空想</text>

  <!-- c4 三轮查新 -->
  <g filter="url(#soft)">
    <rect x="495" y="98" width="130" height="80" rx="18" fill="#FFFFFF" stroke="#60A5FA" stroke-width="2.5"/>
  </g>
  <rect x="511" y="106" width="44" height="7" rx="3.5" fill="#93C5FD"/>
  <text x="511" y="140" font-size="15" font-weight="700" fill="#1D4ED8">📚 三轮查新</text>
  <text x="511" y="162" font-size="10" fill="#6B7280">读正文·非论文渠道</text>

  <!-- c5 上卡验证 -->
  <g filter="url(#soft)">
    <rect x="650" y="98" width="130" height="80" rx="18" fill="#FFFFFF" stroke="#A78BFA" stroke-width="2.5"/>
  </g>
  <rect x="666" y="106" width="44" height="7" rx="3.5" fill="#C4B5FD"/>
  <text x="666" y="140" font-size="15" font-weight="700" fill="#6D28D9">🚀 上卡验证</text>
  <text x="666" y="162" font-size="10" fill="#6B7280">固定预算·基线先行</text>

  <!-- c6 写作与审计 -->
  <g filter="url(#soft)">
    <rect x="805" y="98" width="130" height="80" rx="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2.5"/>
  </g>
  <rect x="821" y="106" width="44" height="7" rx="3.5" fill="#CBD5E1"/>
  <text x="821" y="140" font-size="14.5" font-weight="700" fill="#334155">🛡️ 写作审计</text>
  <text x="821" y="162" font-size="10" fill="#6B7280">story→paper·五层链</text>

  <!-- chain arrows (chubby) -->
  <line x1="162" y1="138" x2="181" y2="138" stroke="#A5B4FC" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
  <line x1="317" y1="138" x2="336" y2="138" stroke="#A5B4FC" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
  <line x1="472" y1="138" x2="491" y2="138" stroke="#A5B4FC" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
  <line x1="627" y1="138" x2="646" y2="138" stroke="#A5B4FC" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
  <line x1="782" y1="138" x2="801" y2="138" stroke="#A5B4FC" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- ===== Branches ===== -->
  <path d="M 560 178 L 560 192 L 415 192 L 415 203" fill="none" stroke="#A5B4FC" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <path d="M 560 192 L 745 192 L 745 203" fill="none" stroke="#A5B4FC" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- branch left: 撞车深挖 -->
  <g filter="url(#soft)">
    <rect x="295" y="206" width="240" height="60" rx="16" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5"/>
  </g>
  <text x="313" y="231" font-size="14" font-weight="700" fill="#B45309">⛏️ 撞车 ≠ 终点</text>
  <text x="313" y="252" font-size="10.5" fill="#92400E">换维度挖新预言，不是收窄题目</text>

  <!-- branch right: 实质重复淘汰 -->
  <g filter="url(#soft)">
    <rect x="625" y="206" width="240" height="60" rx="16" fill="#FEF2F2" stroke="#F87171" stroke-width="2.5"/>
  </g>
  <text x="643" y="231" font-size="14" font-weight="700" fill="#B91C1C">🚫 实质重复 → 淘汰</text>
  <text x="643" y="252" font-size="10.5" fill="#991B1B">记入漏斗 · 警惕原地越钻越窄</text>

  <!-- ===== Tools ===== -->
  <text x="40" y="303" font-size="13" font-weight="700" fill="#475569">🧰 配套工具 · 纯 Python 标准库，任何 agent 都能跑</text>

  <!-- t1 -->
  <g filter="url(#soft)">
    <rect x="40" y="316" width="220" height="48" rx="24" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2.5"/>
  </g>
  <text x="58" y="338" font-size="12" font-weight="700" fill="#1E3A8A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">🔎 novelty_check.py</text>
  <text x="58" y="354" font-size="10" fill="#6B7280">查 arXiv 出候选清单</text>

  <!-- t2 -->
  <g filter="url(#soft)">
    <rect x="272" y="316" width="220" height="48" rx="24" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2.5"/>
  </g>
  <text x="290" y="338" font-size="12" font-weight="700" fill="#4C1D95" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">📒 experiment_log.py</text>
  <text x="290" y="354" font-size="10" fill="#6B7280">keep · discard · crash 汇总</text>

  <!-- t3 -->
  <g filter="url(#soft)">
    <rect x="504" y="316" width="220" height="48" rx="24" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2.5"/>
  </g>
  <text x="522" y="338" font-size="12" font-weight="700" fill="#14532D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">✅ verify_citations.py</text>
  <text x="522" y="354" font-size="10" fill="#6B7280">引用核验 → 幻觉率 HR</text>

  <!-- t4 -->
  <g filter="url(#soft)">
    <rect x="736" y="316" width="220" height="48" rx="24" fill="#FFFFFF" stroke="#FDA4AF" stroke-width="2.5"/>
  </g>
  <text x="754" y="338" font-size="12" font-weight="700" fill="#881337" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">🛡️ audit_chain.py</text>
  <text x="754" y="354" font-size="10" fill="#6B7280">五层审计 PASS/WARN/FAIL</text>

  <!-- ===== Platform bar ===== -->
  <g filter="url(#soft)">
    <rect x="20" y="404" width="920" height="56" rx="28" fill="url(#bar)"/>
  </g>
  <text x="480" y="427" text-anchor="middle" font-size="11.5" fill="#C7D2FE">一套 SKILL.md（方法论）+ scripts/（能力）· 放对目录即用</text>
  <text x="480" y="447" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">🤖 Claude Code · Codex · Cursor · opencode · DeepSeek Harness</text>
</svg>
